# ROS 2 Humble Controller Configuration for Dual Motor Control
# Synchronizes two MX106 motors (IDs 22 and 21) on a single joint

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: false

joint_trajectory_controller:
  ros__parameters:
    joints:
      - dual_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # Allow some tolerance for joint following
    state_publish_rate: 50  # Hz
    action_monitor_rate: 20  # Hz

    # PID gains for position control
    gains:
      dual_joint:
        p: 100.0
        i: 0.0
        d: 10.0
        i_clamp: 0.0

    # Trajectory interpolation
    allow_nonzero_velocity_at_trajectory_start: true
    allow_partial_joints_goal: false

    # Command timeout
    command_timeout: 1.0

# Motor-specific parameters (for Dynamixel interface)
dynamixel_motors:
  ros__parameters:
    port_name: /dev/ttyUSB0
    baud_rate: 1000000

    # Motor 22 configuration
    motor_22:
      id: 22
      model: "MX106"
      operating_mode: 3  # Extended Position Control Mode
      torque_limit: 1000  # mA (adjust based on load)
      velocity_limit: 100  # RPM
      temperature_limit: 70  # Celsius

    # Motor 21 configuration
    motor_21:
      id: 21
      model: "MX106"
      operating_mode: 3
      torque_limit: 1000  # mA (adjust based on load)
      velocity_limit: 100  # RPM
      temperature_limit: 70  # Celsius

    # Synchronization tolerance
    position_error_threshold: 0.05  # rad (~2.9 degrees)
    velocity_error_threshold: 0.1  # rad/s

    # Safety watchdog
    watchdog_timeout: 2.0  # seconds
    disable_torque_on_disconnect: true
